<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142443">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CASPER Mobile</title>
  <link rel="stylesheet" href="assets/css/mobile.css">
  <script>
    window.CASPER_PAGE = { mode: 'hub', sport: null };
    window.CASPER_DATA = {
      pages: ['https://anish-c2.github.io/CASPER', 'https://raw.githubusercontent.com/Anish-C2/CASPER/main', 'https://cdn.jsdelivr.net/gh/Anish-C2/CASPER@main'],
      desktop: 'https://anish-c2.github.io/CASPER/'
    };
  </script>
</head>
<body>
  <header class="m-header">
    <div class="m-top">
      <button class="m-icon" id="menu-btn" aria-label="Open menu">☰</button>
      <a class="m-brand" href="#home">
        <span class="crest">CA</span>
        <span>
          <strong>CASPER</strong>
          <small id="header-sub">Archive</small>
        </span>
      </a>
      <button class="m-icon" id="search-btn" aria-label="Search">⌕</button>
    </div>
    <div class="m-sports" id="sport-pills"></div>
    <div class="m-ticker" id="ticker">Loading archive…</div>
  </header>

  <div class="m-search-bar" id="search-bar" hidden>
    <form id="search-form">
      <input type="search" id="search-input" placeholder="Search player or club" autocomplete="off">
    </form>
  </div>

  <aside class="m-drawer" id="drawer" hidden>
    <div class="m-drawer-head">
      <span>Navigate</span>
      <button class="m-icon" id="drawer-close" aria-label="Close">✕</button>
    </div>
    <nav class="m-drawer-nav">
      <a href="#home">Home</a>
      <a href="#news">News</a>
      <a href="#archive">Competitions</a>
      <a href="#players">Players</a>
      <a href="#teams">Clubs</a>
      <a href="#awards">Awards</a>
      <a href="#ranking">Ranking</a>
      <a href="#records">Records</a>
      <a href="#statistics">Statistics</a>
      <a href="#about">About</a>
    </nav>
    <p class="muted tiny"><a href="https://anish-c2.github.io/CASPER/" target="_blank" rel="noopener">Open desktop site</a></p>
  </aside>
  <div class="m-scrim" id="scrim" hidden></div>

  <main id="app">
    <div class="card"><p class="muted">Opening the CASPER archive…</p></div>
  </main>

  <nav class="m-tabbar">
    <a href="#home" data-view="home">Home</a>
    <a href="#archive" data-view="archive">Comps</a>
    <a href="#players" data-view="players">Players</a>
    <a href="#teams" data-view="teams">Clubs</a>
    <a href="#ranking" data-view="ranking">Ranks</a>
  </nav>

  <footer class="m-foot">
    <div>© 2026 CASPER</div>
    <div>Data from the desktop archive. One source.</div>
  </footer>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
